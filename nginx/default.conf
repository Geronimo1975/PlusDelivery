# Nginx pentru PlusDelivery: redirect HTTP->HTTPS, TLS, static, proxy /ws/ + app.
# INLOCUIESTE: pune domeniul tau in locul lui DOMENIU.EXEMPLU.RO (3 locuri).

upstream plusdelivery_web {
    server web:8000;
}

# --- HTTP: provocare ACME (Certbot) + redirect la HTTPS --------------------
server {
    listen 80;
    server_name DOMENIU.EXEMPLU.RO;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS -----------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name DOMENIU.EXEMPLU.RO;

    ssl_certificate     /etc/letsencrypt/live/DOMENIU.EXEMPLU.RO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMENIU.EXEMPLU.RO/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 10M;

    # Fisiere statice servite direct de Nginx (volum partajat cu web).
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # WebSocket pentru urmarirea live (Django Channels).
    location /ws/ {
        proxy_pass http://plusdelivery_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;  # conexiuni WS de lunga durata
    }

    # Restul aplicatiei (HTTP).
    location / {
        proxy_pass http://plusdelivery_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
