{% load static %}
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PlusDelivery — Lieferungen & Transport auf Abruf</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
        integrity="sha384-c6Rcwz4e4CITMbu/NBmnNS8yN2sC3cUElMEMfP3vqqKFp7GOYaaBBCqmaWBjmkjb" crossorigin="" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
          integrity="sha384-NElt3Op+9NBMCYaef5HxeJmU4Xeard/Lku8ek6hoPTvYkQPh3zLIrJP7KiRocsxO" crossorigin=""></script>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <span class="dot">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 7h11v8H3zM14 10h4l3 3v2h-7z"/><circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/></svg>
        </span>
        PlusDelivery
      </div>

      <div class="header-right">
        <div class="userbox" id="userBox" hidden></div>
        <select class="lang-select" id="langSelect" aria-label="Sprache / Language / Limba" title="Sprache / Language / Limba">
          <option value="de">DE</option>
          <option value="en">EN</option>
          <option value="ro">RO</option>
        </select>
        <button class="icon-btn" id="themeBtn" title="Theme wechseln (hell/dunkel)" aria-label="Theme wechseln">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="view active" id="view-auth"></section>
    <section class="view" id="view-client"></section>
    <section class="view" id="view-driver"></section>
  </main>

  <div class="toast" id="toast"></div>
  <script src="{% static 'js/app.js' %}" type="module"></script>
  <!-- Motion (fost Framer Motion) — micro-interactiuni globale (hover/press pe .btn) -->
  <script src="{% static 'js/motion-global.js' %}" type="module"></script>
</body>
</html>
