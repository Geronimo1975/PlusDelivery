# PlusDelivery - stack de productie.
# Porneste: docker compose -f docker-compose.prod.yml up -d --build
# Trei servicii: Postgres (date), web (Daphne/ASGI), Nginx (TLS + proxy + /ws/).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plusdelivery}
      POSTGRES_USER: ${POSTGRES_USER:-plusdelivery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?seteaza POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plusdelivery}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      - static_files:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
      - ./nginx/certs:/etc/letsencrypt:ro   # certificate Let's Encrypt (vezi README)
    depends_on:
      - web

volumes:
  postgres_data:
  static_files:
