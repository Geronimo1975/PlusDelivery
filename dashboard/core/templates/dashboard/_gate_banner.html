{% comment %}Banner afisat cand contul nu este validat. Link catre poarta de validare.{% endcomment %}
<div class="gate-banner" role="status">
  <span class="gate-ico" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
  </span>
  <div>
    <h2>Konto nicht bestätigt</h2>
    <p>Bestätige dein Konto, um Bestellungen aufzugeben oder dich als Fahrer zu bewerben.</p>
  </div>
  <form method="get" action="{% url 'dashboard:gate' %}">
    <button type="submit" class="btn btn-accent">Jetzt bestätigen</button>
  </form>
</div>
